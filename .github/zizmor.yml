# zizmor (GitHub Actions security auditor) configuration.
# Docs: https://docs.zizmor.sh/
rules:
  unpinned-uses:
    config:
      policies:
        # Every action must be pinned to a full commit SHA (with a version comment for
        # readability). Mutable tag refs are rejected to prevent supply chain attacks.
        "*": hash-pin

  artipacked:
    # Deliberate: the release checkout must persist git credentials because the job pushes
    # the release tag. Every other checkout in the repo sets `persist-credentials: false`.
    ignore:
      - release.yml:29
