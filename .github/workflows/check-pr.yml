name: Check PR

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "26"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job declares the permissions it needs.
permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-analyse:
    name: 🔍 Lint, Format & Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # publish the PHPStan checkstyle report

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: 📷 Composer Dependencies Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.json') }}

      - name: 💾 Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 📷 Rector Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-rector-

      - name: 📷 Pint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.pint.cache
          key: ${{ runner.os }}-pint-${{ hashFiles('pint.json', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-pint-

      - name: 🔧️ Run Rector
        run: composer rector

      - name: 🍺 Run Laravel Pint
        run: composer format:php

      - name: 📷 PHPStan Result Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/phpstan
          key: phpstan-results-${{ hashFiles('phpstan.neon', 'composer.json') }}
          restore-keys: |
            phpstan-results-${{ hashFiles('phpstan.neon') }}-
            phpstan-results-

      - name: 🔬 PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=checkstyle > phpstan-report.xml

      - name: 📊 Publish PHPStan Report
        if: github.actor != 'dependabot[bot]' && always()
        uses: lcollins/checkstyle-github-action@832a70dc40e28517ddb45ac5ac8b2ad1279bd54d # v4.0.0
        with:
          name: "📊 PHPStan Analysis Report"
          path: "phpstan-report.xml"
          title: "PHPStan Analysis Report"

      - name: 🔍 Fail on Uncommitted Changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Rector/Pint made changes. Run \`composer all\` locally and commit the result."
            git --no-pager diff
            exit 1
          fi

  unit-tests:
    name: 🧪 Tests — PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})${{ matrix.swagger && format(' / swagger-php {0}', matrix.swagger) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_KEY: php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}${{ matrix.swagger && format('-swagger{0}', matrix.swagger) || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 12
          - php: "8.3"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-lowest"
          - php: "8.3"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-stable"
          - php: "8.4"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-stable"
          - php: "8.5"
            laravel: "12"
            testbench: "10.*"
            stability: "prefer-stable"

          # Laravel 13
          - php: "8.3"
            laravel: "13"
            testbench: "11.*"
            stability: "prefer-stable"
          - php: "8.5"
            laravel: "13"
            testbench: "11.*"
            stability: "prefer-stable"

          # swagger-php 6 (prefer-stable resolves 7, prefer-lowest resolves 5)
          - php: "8.5"
            laravel: "13"
            testbench: "11.*"
            stability: "prefer-stable"
            swagger: "6"

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: 💾 Install Dependencies
        run: |
          composer require "orchestra/testbench:$TESTBENCH" --no-interaction --no-update
          if [ -n "$SWAGGER_PHP" ]; then
            composer require "zircote/swagger-php:^$SWAGGER_PHP.0" --no-interaction --no-update
          fi
          composer update --no-interaction --prefer-dist "--$STABILITY"
        env:
          TESTBENCH: ${{ matrix.testbench }}
          STABILITY: ${{ matrix.stability }}
          SWAGGER_PHP: ${{ matrix.swagger }}

      - name: 📷 PHPUnit Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.phpunit.cache
          key: ${{ runner.os }}-phpunit-${{ env.RUN_KEY }}-${{ hashFiles('phpunit.xml', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-phpunit-${{ env.RUN_KEY }}-

      - name: 🎯 Configure PHPUnit Matcher
        uses: mheap/phpunit-matcher-action@dcbd4ead41890163b65d0b21534387ce72980ee5 # v1.4.0

      - name: 🧪 Run Pest
        run: >
          ./vendor/bin/pest
          --parallel
          --cache-result
          --cache-directory=.phpunit.cache
          --log-junit ".build/junit-$RUN_KEY.xml"
          --teamcity

      - name: 📦 Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Test Results ${{ env.RUN_KEY }}
          path: .build/junit-${{ env.RUN_KEY }}.xml
          retention-days: 1

  browser-tests:
    name: 🌐 Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Install Dependencies (Laravel 13 / PHP 8.5)
        run: |
          composer require "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --no-interaction --prefer-dist --prefer-stable
          npm install --no-audit --no-fund

      # Playwright recommends downloading browsers on each run: restoring a cache takes as long,
      # and the system libraries it installs can't be cached.
      - name: 🎭 Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎯 Configure PHPUnit Matcher
        uses: mheap/phpunit-matcher-action@dcbd4ead41890163b65d0b21534387ce72980ee5 # v1.4.0

      - name: 🌐 Run Browser Tests
        run: >
          ./vendor/bin/pest
          --testsuite=Browser
          --parallel
          --ci
          --log-junit .build/junit-browser.xml
          --teamcity

      - name: 📦 Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Test Results Browser
          path: .build/junit-browser.xml
          retention-days: 1

      - name: 📸 Upload Failure Screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Browser Test Screenshots
          path: tests/Browser/Screenshots
          retention-days: 7

  publish-test-results:
    name: 📊 Test Results
    needs: [unit-tests, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # download the test result artifacts
      checks: write # publish the test results check
      pull-requests: write # comment the test results on the PR
    if: always() && github.actor != 'dependabot[bot]'

    steps:
      - name: 📥 Download Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: Test Results *
          merge-multiple: true

      - name: 📊 Publish Test Results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          check_name: "📊 Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "artifacts/**/*.xml"

      - name: 📉 Fail on Errors
        if: ${{ fromJSON( steps.test-results.outputs.json ).conclusion != 'success' }}
        run: |
          false

  coverage:
    name: 📈 Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read the base branch's coverage artifact
      pull-requests: write # comment the coverage report on the PR
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov

      - name: 💾 Install Dependencies (Laravel 13 / PHP 8.5)
        run: |
          composer require "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --no-interaction --prefer-dist --prefer-stable

      - name: 🧪 Run Pest with Coverage
        run: >
          ./vendor/bin/pest
          --parallel
          --coverage-clover .build/clover.xml

      - name: 📊 Generate Coverage Report
        id: coverage
        uses: clearlyip/code-coverage-report-action@110af9d4ec87b6706f182fd90e3102af9e5203bf # v7.0.0
        with:
          filename: .build/clover.xml
          artifact_download_workflow_names: "Check PR"
          with_base_coverage_template: .github/coverage-with-base.hbs
          without_base_coverage_template: .github/coverage-without-base.hbs

      - name: 💬 Coverage PR Comment
        if: github.event_name == 'pull_request' && steps.coverage.outputs.file != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          recreate: true
          path: code-coverage-results.md
